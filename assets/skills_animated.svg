<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <linearGradient id="meter1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="meter2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="meter3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="meter4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes dashCircle {
        0% { stroke-dashoffset: 260; }
        50% { stroke-dashoffset: 45; }
        100% { stroke-dashoffset: 260; }
      }
      .ring-1 { stroke-dasharray: 260; animation: dashCircle 6s ease-in-out infinite; }
      .ring-2 { stroke-dasharray: 260; animation: dashCircle 5.2s ease-in-out infinite 0.4s; }
      .ring-3 { stroke-dasharray: 260; animation: dashCircle 6.8s ease-in-out infinite 0.8s; }
      .ring-4 { stroke-dasharray: 260; animation: dashCircle 5.6s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="216" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Card 1: Systems & Microkernel -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="212" height="184" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    <circle cx="106" cy="65" r="38" fill="none" stroke="#1e293b" stroke-width="6"/>
    <circle cx="106" cy="65" r="38" fill="none" stroke="url(#meter1)" stroke-width="6" stroke-linecap="round" class="ring-1" transform="rotate(-90 106 65)" filter="url(#glowFilt)"/>
    <text x="106" y="69" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">Ring 0</text>
    <text x="106" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Microkernel</text>
    <text x="106" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Low-Level Systems</text>
    <text x="106" y="146" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8" text-anchor="middle">IA-32 • Paging • UART</text>
    <text x="106" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f0ff" text-anchor="middle">● C &amp; x86 Assembly</text>
  </g>

  <!-- Card 2: Security & Capabilities -->
  <g transform="translate(254, 18)">
    <rect x="0" y="0" width="212" height="184" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    <circle cx="106" cy="65" r="38" fill="none" stroke="#1e293b" stroke-width="6"/>
    <circle cx="106" cy="65" r="38" fill="none" stroke="url(#meter2)" stroke-width="6" stroke-linecap="round" class="ring-2" transform="rotate(-90 106 65)" filter="url(#glowFilt)"/>
    <text x="106" y="69" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">100%</text>
    <text x="106" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Zero Ambient</text>
    <text x="106" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Security Architecture</text>
    <text x="106" y="146" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8" text-anchor="middle">Capability Space • Sandboxing</text>
    <text x="106" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" text-anchor="middle">● Antra &amp; UFW Defense</text>
  </g>

  <!-- Card 3: Distributed & FinTech -->
  <g transform="translate(484, 18)">
    <rect x="0" y="0" width="212" height="184" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    <circle cx="106" cy="65" r="38" fill="none" stroke="#1e293b" stroke-width="6"/>
    <circle cx="106" cy="65" r="38" fill="none" stroke="url(#meter3)" stroke-width="6" stroke-linecap="round" class="ring-3" transform="rotate(-90 106 65)" filter="url(#glowFilt)"/>
    <text x="106" y="69" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#c084fc" text-anchor="middle">Ledger</text>
    <text x="106" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Consensus</text>
    <text x="106" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Decentralized Systems</text>
    <text x="106" y="146" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8" text-anchor="middle">ShramLedger • Immutability</text>
    <text x="106" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c084fc" text-anchor="middle">● Smart Contract Flows</text>
  </g>

  <!-- Card 4: Search & High Performance Web -->
  <g transform="translate(714, 18)">
    <rect x="0" y="0" width="222" height="184" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    <circle cx="111" cy="65" r="38" fill="none" stroke="#1e293b" stroke-width="6"/>
    <circle cx="111" cy="65" r="38" fill="none" stroke="url(#meter4)" stroke-width="6" stroke-linecap="round" class="ring-4" transform="rotate(-90 111 65)" filter="url(#glowFilt)"/>
    <text x="111" y="69" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#f43f5e" text-anchor="middle">Search</text>
    <text x="111" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">High QPS</text>
    <text x="111" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Search &amp; Full-Stack</text>
    <text x="111" y="146" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8" text-anchor="middle">Prism Engine • FastAPI</text>
    <text x="111" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fb7185" text-anchor="middle">● Python, JS, React</text>
  </g>
</svg>
